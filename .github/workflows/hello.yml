name: Hello CI   # Friendly name shown in the GitHub UI

on:
  push:
    branches: [main]   # Run when code is pushed to main

jobs:
  greet:
    runs-on: ubuntu-latest   # GitHub-hosted Ubuntu VM
    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Show the date
        run: date

      - name: Show the runner OS
        run: uname -a

      - name: List files in the repo
        run: ls -la
